version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: financeiro_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-financeiro}
    volumes:
      - mongodb_data:/data/db
    networks:
      - financeiro_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeiro_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DATABASE:-financeiro}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - financeiro_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeiro_frontend
    restart: unless-stopped
    ports:
      - '4200:4200'
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - financeiro_network

volumes:
  mongodb_data:
    driver: local

networks:
  financeiro_network:
    driver: bridge
